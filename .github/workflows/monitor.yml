name: monitor

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00, 每天一次
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      run_ai:
        description: "是否调用 LLM 做归因(需要仓库 secret DEEPSEEK_API_KEY)"
        type: boolean
        default: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 规则层自检
        run: python detector.py

      - name: 阈值扫描评测
        run: python evaluate.py

      - name: 完整流水线(有 key 才跑 AI)
        run: |
          # 定时任务: 有 key 就跑; 手动触发: 勾选 run_ai 且配置了 key 才跑
          if [ -n "$DEEPSEEK_API_KEY" ] && { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.run_ai }}" = "true" ]; }; then
            python analyze.py
          else
            echo "未配置 key 或未勾选 run_ai, 跳过 AI 归因(规则层与评测结果已产出)"
          fi

      - name: 上传评测报告与日报
        uses: actions/upload-artifact@v4
        with:
          name: monitor-reports
          path: reports/
          if-no-files-found: warn
